<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="640" height="160">
  <defs>
    <linearGradient id="logoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="logoGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Loop Icon Group -->
  <g transform="translate(10, 5)">
    <rect width="70" height="70" rx="18" fill="#0F172A" />
    <path
      d="M23 35 C12 35 12 20 25 20 C35 20 43 50 52 50 C63 50 63 35 52 35 C42 35 35 20 25 20 C12 20 12 35 23 35 Z"
      fill="none"
      stroke="url(#logoGrad1)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M52 35 C63 35 63 20 52 20 C42 20 35 50 25 50 C12 50 12 35 23 35"
      fill="none"
      stroke="url(#logoGrad2)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />
    <circle cx="25" cy="20" r="2.5" fill="#06B6D4" filter="url(#logoGlow)" />
    <circle cx="52" cy="50" r="2.5" fill="#8B5CF6" filter="url(#logoGlow)" />
  </g>

  <!-- Typography -->
  <text x="95" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#0F172A" letter-spacing="-0.5">
    Event<tspan fill="url(#textGrad)">loo</tspan>
  </text>
  <text x="96" y="63" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="1.5">
    EVENT MANAGEMENT SYSTEM
  </text>
</svg>
