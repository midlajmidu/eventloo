<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="640" height="160">
  <defs>
    <linearGradient id="logoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="logoGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Loop Icon Group (Clean Transparent Background matching Login page) -->
  <g transform="translate(4, 5) scale(0.72)">
    <path
      d="M30 50 C15 50 15 28 32 28 C45 28 55 72 68 72 C85 72 85 50 70 50 C55 50 45 28 32 28 C15 28 15 50 30 50 Z"
      fill="none"
      stroke="url(#logoGrad1)"
      stroke-width="8.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M70 50 C85 50 85 28 68 28 C55 28 45 72 32 72 C15 72 15 50 30 50"
      fill="none"
      stroke="url(#logoGrad2)"
      stroke-width="8.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />
    <circle cx="32" cy="28" r="3.2" fill="#06B6D4" filter="url(#logoGlow)" />
    <circle cx="68" cy="72" r="3.2" fill="#8B5CF6" filter="url(#logoGlow)" />
  </g>

  <!-- Typography -->
  <text x="82" y="47" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#0F172A" letter-spacing="-0.5">
    Event<tspan fill="url(#textGrad)">loo</tspan>
  </text>
  <text x="83" y="63" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#64748B" letter-spacing="1.5">
    EVENT MANAGEMENT SYSTEM
  </text>
</svg>
