name: Production checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventloo
          POSTGRES_PASSWORD: eventloo_test
          POSTGRES_DB: eventloo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eventloo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-only-django-secret-key-with-sufficient-length
      JWT_SIGNING_KEY: ci-only-independent-jwt-key-with-sufficient-length
      DATABASE_URL: postgresql://eventloo:eventloo_test@localhost:5432/eventloo_test
      DATABASE_SSL_REQUIRE: 'False'
      REDIS_URL: redis://localhost:6379/1
      ALLOWED_HOSTS: localhost
      CORS_ALLOWED_ORIGINS: https://app.example.test
      CSRF_TRUSTED_ORIGINS: https://app.example.test
      AWS_STORAGE_BUCKET_NAME: eventloo-ci-private-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pip-audit
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py check --deploy
      - run: python backend/manage.py test --verbosity 1
      - run: pip-audit -r backend/requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
