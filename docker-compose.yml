services:
  eventloo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventloo
    ports:
      - "${PORT:-80}:80"
    environment:
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-Admin1234!}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@eventloo.com}
      - SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME:-Platform Super Admin}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-app.eventloo.in,app.eventloo.com,localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://app.eventloo.in,http://app.eventloo.in,https://app.eventloo.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://app.eventloo.in,http://app.eventloo.in,https://app.eventloo.com}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      # Optional: Uncomment if connecting to external PostgreSQL
      # - DATABASE_URL=postgres://user:password@host:5432/eventloo
      # Optional: Uncomment if connecting to external Redis
      # - REDIS_URL=redis://host:6379/0
      # Optional: Uncomment if connecting to AWS S3
      # - AWS_STORAGE_BUCKET_NAME=my-bucket
      # - AWS_ACCESS_KEY_ID=...
      # - AWS_SECRET_ACCESS_KEY=...
    volumes:
      - eventloo_data:/app/data
      - eventloo_media:/app/media
    restart: unless-stopped

volumes:
  eventloo_data:
    driver: local
  eventloo_media:
    driver: local
