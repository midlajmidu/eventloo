services:
  eventloo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventloo
    ports:
      - "${PORT:-8080}:80"
    environment:
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-eventlooadmin#321}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@eventloo.in}
      - SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME:-Platform Super Admin}
      - REQUIRE_SUPER_ADMIN_MFA=${REQUIRE_SUPER_ADMIN_MFA:-false}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-app.eventloo.in,app.eventloo.com,localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://app.eventloo.in,http://app.eventloo.in,https://app.eventloo.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://app.eventloo.in,http://app.eventloo.in,https://app.eventloo.com}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      # Email Configuration (Zoho SMTP)
      - NOREPLY_EMAIL_USER=${NOREPLY_EMAIL_USER:-noreply@eventloo.in}
      - NOREPLY_EMAIL_PASSWORD=${NOREPLY_EMAIL_PASSWORD:-EyqVrVAGVEYP}
      - CONTACT_EMAIL_USER=${CONTACT_EMAIL_USER:-contact@eventloo.in}
      - CONTACT_EMAIL_PASSWORD=${CONTACT_EMAIL_PASSWORD:-9HfUJjAK07t5}
      # Optional: Uncomment if connecting to external PostgreSQL
      # - DATABASE_URL=postgres://user:password@host:5432/eventloo
      # Optional: Uncomment if connecting to external Redis
      # - REDIS_URL=redis://host:6379/0
      # Optional: Uncomment if connecting to AWS S3
      # - AWS_STORAGE_BUCKET_NAME=my-bucket
      # - AWS_ACCESS_KEY_ID=...
      # - AWS_SECRET_ACCESS_KEY=...
    volumes:
      - eventloo_data:/app/data
      - eventloo_media:/app/media
    restart: unless-stopped

volumes:
  eventloo_data:
    driver: local
  eventloo_media:
    driver: local
